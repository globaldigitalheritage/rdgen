name: Fetch Encrypted Secrets

on:
  workflow_call:
    inputs:
      zip_url_json:
        required: true
        type: string

jobs:
  download-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Download with Retry
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          shell: python
          command: |
            import requests
            import json
            import time

            input_data = json.loads('${{ inputs.zip_url_json }}')
            # GDH PATCH: accept a direct URL as well as an rdgen server.
            # Upstream only builds "<url>/get_zip?filename=<file>", which
            # requires a reachable rdgen instance - and that app has no
            # authentication, so it must never be public. With {"direct": ...}
            # the config zip can come from anywhere the runner can reach, e.g.
            # a release asset on this fork, so a build needs no hosted service.
            # The zip is AES-encrypted with ZIP_PASSWORD either way.
            if input_data.get('direct'):
                url = input_data['direct']
            else:
                url = f"{input_data['url']}/get_zip?filename={input_data['file']}"
            
            for attempt in range(5):
                try:
                    print(f"Downloading (Attempt {attempt + 1})...")
                    r = requests.get(url, timeout=20)
                    r.raise_for_status()
                    with open('secrets.zip', 'wb') as f:
                        f.write(r.content)
                    break
                except Exception as e:
                    if attempt < 4:
                        time.sleep(5 * (2 ** attempt))
                    else: raise e

      - name: Upload Encrypted Artifact
        uses: actions/upload-artifact@v7
        with:
          name: encrypted-secrets-zip
          path: secrets.zip
          retention-days: 1